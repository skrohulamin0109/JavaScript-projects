<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css" />
        <script src="script.js" defer></script>
        <title>Weather Application</title>
    </head>
    <body>
        <div class="backgroudContainer">
            <div class="leftContainer">
                <div class="leftData">
                    <div class="leftTemp"></div>
                    <div class="leftPlaceInfo">
                      <h2></h2>
                      <p></p>
                    </div>
                    <div class="leftWeatherIcon"></div>
                </div>
            </div>
            <div class="rightContainer">
              <div class="searchBar">
                <input type="text" class="searchLocation" placeholder="Search your city..." />
                <button>🔍</button>
              </div>
                <p style="margin-bottom: 20px; font-family: 'Courier New', Courier, monospace; color: #1d1c1c;">weather details...</p>
                <div class="rightWeatherData">
                    <h2></h2>
                    <div class="rightWeatherDetails maxTemp">
                        <p>Max Temp</p>
                        <div class="numberIcon">
                            <p class="val">--</p>
                            <span>♨️</span>
                        </div>
                    </div>
                    <div class="rightWeatherDetails minTemp">
                        <p>Min Temp</p>
                        <div class="numberIcon">
                            <p class="val">--</p>
                            <span>☃️</span>
                        </div>
                    </div>
                    <div class="rightWeatherDetails humidity">
                        <p>Humidity</p>
                        <div class="numberIcon">
                            <p class="val">--</p>
                            <span>💧</span>
                        </div>
                    </div>
                    <div class="rightWeatherDetails cloudy">
                        <p>Cloudy</p>
                        <div class="numberIcon">
                            <p class="val">--</p>
                            <span>☁️</span>
                        </div>
                    </div>
                    <div class="rightWeatherDetails wind">
                        <p>Wind</p>
                        <div class="numberIcon">
                            <p class="val">--</p>
                            <span>💨</span>
                        </div>
                    </div>
                </div>


          <!-- <p class="seperator">______________________________</p>
                <div class="todaysForcast">
                    <p>todays forecast</p>
                    <div class="forecastList">
                        <span class="todaysForcastIcon">icon</span>
                        <div class="timeWeather">
                            <p class="time">time</p>
                            <p class="weather">weather</p>
                        </div>
                        <p class="temp">temp</p>
                    </div>
                </div> -->
            </div>
        </div>
    </body>
</html>
